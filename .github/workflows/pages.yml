name: Deploy profil-dr-dwi to GitHub Pages

on:
  push:
    paths:
      - 'lenovo/profil-dr-dwi/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload only the profile site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: lenovo/profil-dr-dwi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
